# Name reservation only. No code. The real SDK ships from sdk/python in this repo.
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "seam-branchpoint"
version = "0.0.0"
description = "Reserved name for the Seam Branchpoint SDK (attested experiments for AI decisions). No code yet."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
classifiers = ["Development Status :: 1 - Planning"]

[tool.hatch.build.targets.wheel]
bypass-selection = true
