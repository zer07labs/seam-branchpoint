# The full gate, as two jobs: `contract gate` (buf lint/format/breaking, both reference implementations regenerate
# the golden vectors byte-identically and pass their tests, SHA256SUMS holds, the AS-2 SDK suites without the
# wall-clock perf tests, cross-SDK conformance) on the smallest runner, and `perf gate` (the real-clock perf tests,
# bounds unchanged: Python p99 < 50 µs, TS p99 < 50 µs and >= 20k attested evals/s) on GitHub's 4-vCPU ubuntu-24.04. Both are
# required checks on main (ruleset `main`). docs/ci-cost.md has the cost rules.
#
#   pull_request → runs (two jobs, about 5 billed minutes). Superseded pushes cancel.
#   merge_group  → `changes` diffs the queue commit against merge_group.base_sha; the suite runs only when a
#                  contract or SDK path changed, and FAILS CLOSED (any diff error, or a failed `changes`, runs it).
#                  No queue is configured today; this is ready for one. Both suite jobs always report, so a
#                  required check is never absent.
#   push to main → nothing: the PR (or queue) already ran this tree.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes (queue path filter)
    if: github.event_name == 'merge_group'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.f.outputs.relevant }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
      - id: f
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if ! git fetch --no-tags --depth=1 origin "$BASE" >/dev/null 2>&1 \
             || ! FILES=$(git diff --name-only "$BASE" HEAD) || [ -z "$FILES" ]; then
            echo "::warning::could not diff the queue commit against its base — failing CLOSED (running the suite)"
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$FILES"
          if grep -qE '^(proto/|buf\.yaml$|buf\.lock$|reference/|contract/|sdk/|tests/|\.github/)' <<< "$FILES"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  contract:
    name: contract gate
    needs: [changes]
    if: >-
      !cancelled()
      && (github.event_name != 'merge_group' || needs.changes.result != 'success' || needs.changes.outputs.relevant != 'false')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: "1.66.0"
          github_token: ${{ github.token }}
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.18"
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json
      - name: buf lint + format
        run: |
          buf lint
          buf format --diff --exit-code
      - name: buf breaking (against the base branch)
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          # A base ref that does not resolve is an error, never a silent skip.
          git rev-parse --verify --quiet "origin/$BASE_REF^{commit}" >/dev/null \
            || { echo "::error::base ref origin/$BASE_REF does not resolve"; exit 1; }
          if [ -n "$(git ls-tree -d --name-only "origin/$BASE_REF" proto)" ]; then
            buf breaking --against ".git#branch=origin/$BASE_REF"
          else
            echo "::notice::base origin/$BASE_REF has no proto/ — first contract PR, breaking check has nothing to compare"
          fi
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: golden SHA256SUMS
        run: (cd contract/golden/branchpoint && sha256sum --check --strict SHA256SUMS) && (cd contract/golden/branchpoint-sdk && sha256sum --check --strict SHA256SUMS)
      - name: golden gate — local copies match the hub pins
        run: python3 contract/scripts/golden_gate.py local --repo seam-branchpoint --manifest contract/golden-manifest.json
      - name: Python reference — regenerate (--check) + tests
        run: |
          uv run --script reference/python/branchpoint_ref.py --check
          uv run --script reference/python/test_branchpoint_ref.py
      - name: TypeScript reference — regenerate (--check) + tests
        run: |
          node reference/ts/branchpoint_ref.ts --check
          node --test reference/ts/branchpoint_ref.test.ts
      # The wall-clock perf tests run in `perf gate`, not here (a 2-vCPU runner is too noisy for a 50 µs p99).
      - name: Python SDK — tests (3.11 floor; extras, then core only, then the openfeature-sdk floor)
        working-directory: sdk/python
        env:
          UV_PYTHON: "3.11"
        run: |
          uv sync --frozen
          uv run --frozen pytest -q --ignore=tests/test_perf.py
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/bp-core" uv run --frozen --no-dev --with pytest --with hypothesis pytest -q --ignore=tests/test_perf.py
          uv run --frozen --with openfeature-sdk==0.8.1 pytest -q tests/test_openfeature.py tests/test_otel.py
      - name: TypeScript SDK — typecheck, build, tests
        working-directory: sdk/ts
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm run test:unit
      - name: cross-SDK conformance
        run: uv run --script tests/conformance/conformance.py

  perf:
    name: perf gate
    needs: [changes]
    if: >-
      !cancelled()
      && (github.event_name != 'merge_group' || needs.changes.result != 'success' || needs.changes.outputs.relevant != 'false')
    # A measured need (PR #5: Python p99 51.2 µs vs the 50 µs bound on Blacksmith 2 vCPU). Blacksmith 4 vCPU was tried
    # and was noisier (PR #6: Python median p99 57.5 µs, TS 6.7k evals/s with per-round degradation), so this runs on
    # GitHub's standard ubuntu-24.04 (4 vCPU, its own VM, unbilled on a public repo). The bounds are never loosened
    # for a slow host; the host changes instead.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.18"
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json
      - name: Python SDK — perf (p99 < 50 µs, >= 20k attested evals/s; 3.11 floor)
        working-directory: sdk/python
        env:
          UV_PYTHON: "3.11"
        run: |
          uv sync --frozen
          uv run --frozen pytest -q -s tests/test_perf.py
      - name: TypeScript SDK — perf (p99 < 50 µs, >= 20k attested evals/s)
        working-directory: sdk/ts
        run: |
          npm ci
          npm run test:perf
