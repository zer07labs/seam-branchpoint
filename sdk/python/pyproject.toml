[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "seam-branchpoint"
version = "0.1.0"
description = "Seam Branchpoint SDK: attested-grade experiments for AI decisions (local bpa1 assignment, signed hash-chained receipts)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["cryptography>=50.0.2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/zer07labs/seam-branchpoint"
Source = "https://github.com/zer07labs/seam-branchpoint/tree/main/sdk/python"

[project.optional-dependencies]
# 0.8.1: the first release whose client keeps a resolution's `flag_metadata` on an error (FLAG_NOT_FOUND,
# TYPE_MISMATCH carry `bp_reason`; <=0.8.0 raised and dropped it). Older and still needed: `attach`-wired provider
# events (0.7.1), `Hook.finally_after(hook_context, details, hints)` (0.7.5), `get_provider_hooks`, dict metadata.
openfeature = ["openfeature-sdk>=0.8.1"]
# The 1.x stable trace API: `get_current_span`, `Span.is_recording`, `Span.add_event`.
otel = ["opentelemetry-api>=1.0"]

[dependency-groups]
dev = ["pytest>=9.0", "hypothesis>=6.150", "seam-branchpoint[openfeature,otel]", "opentelemetry-sdk>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/seam_branchpoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
